<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查询</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #0a4da3 0%, #1e90ff 55%, #7cc7ff 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    padding: 40px 24px;
    box-shadow: 0 12px 40px rgba(10,77,163,0.35);
  }
  .step { display:none; }
  .step.active { display:block; }
  .step .tag {
    font-size: 15px; font-weight: 700; letter-spacing: 2px; color:#0a4da3;
    text-align:center; margin-bottom: 22px;
  }
  .boxes { display:flex; justify-content:center; gap:12px; }
  .boxes input {
    width: 56px; height: 64px; text-align:center; font-size: 30px; color:#0a4da3;
    border: 2px solid #c9dcf3; border-radius: 12px; outline:none; background:#f4f9ff;
  }
  .boxes input:focus { border-color:#1e90ff; background:#fff; }
  .result { margin-top: 26px; }
  .stat { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .stat .box {
    flex:1 1 90px; background:#f4f9ff; border-radius:12px; padding:14px 8px; text-align:center;
  }
  .stat .box .num { font-size: 24px; font-weight:700; color:#0a4da3; }
  .stat .box .lbl { font-size: 12px; color:#7a8ba6; margin-top:4px; }
  .greet { text-align:center; font-size:17px; font-weight:600; color:#2b3a55; margin-bottom:16px; }
  .list { border:1px solid #e3eefb; border-radius:10px; overflow:hidden; }
  .row {
    display:flex; justify-content:space-between; padding:11px 14px; font-size:14px; color:#3a4a66;
    border-bottom:1px solid #eef4fb;
  }
  .row:last-child { border-bottom:none; }
  .row .d { color:#0a4da3; font-weight:600; }
  .empty { text-align:center; color:#9aa7b8; font-size:14px; padding:16px; }
  .msg { text-align:center; font-size:13px; margin-top:14px; min-height:18px; }
  .msg.err { color:#e0555d; }
  .back { text-align:center; margin-top:16px; }
  .back button {
    background:none; border:1px solid #c9dcf3; color:#7a8ba6; border-radius:8px;
    padding:8px 20px; font-size:13px; cursor:pointer;
  }
  .back button:active { background:#f4f9ff; }
</style>
</head>
<body>
<div class="card">
  <div class="step active" id="s-id">
    <div class="tag">ID</div>
    <div class="boxes" id="b-id"></div>
  </div>
  <div class="step" id="s-phone">
    <div class="tag">MB</div>
    <div class="boxes" id="b-phone"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="result" id="result" style="display:none"></div>
</div>

<script>
(function(){
  var msg=document.getElementById('msg');
  var result=document.getElementById('result');
  var sId=document.getElementById('s-id');
  var sPhone=document.getElementById('s-phone');
  var idcVal='', phoneVal='';

  function buildBoxes(container){
    var inputs=[];
    for(var i=0;i<4;i++){
      (function(idx){
        var inp=document.createElement('input');
        inp.type='text'; inp.inputMode='numeric'; inp.maxLength=1; inp.autocomplete='off';
        inp.addEventListener('input',function(){
          this.value=this.value.replace(/\D/g,'').slice(0,1);
          if(this.value && idx<3){ inputs[idx+1].focus(); }
          sync(container, inputs);
        });
        inp.addEventListener('keydown',function(e){
          if(e.key==='Backspace' && !this.value && idx>0){ inputs[idx-1].focus(); inputs[idx-1].value=''; sync(container, inputs); }
        });
        inp.addEventListener('focus',function(){ this.select(); });
        container.appendChild(inp);
        inputs.push(inp);
      })(i);
    }
    return inputs;
  }

  function sync(container, inputs){
    var val='';
    inputs.forEach(function(inp){ val+=inp.value; });
    if(container.id==='b-id'){
      idcVal=val;
      if(val.length===4){ sId.classList.remove('active'); sPhone.classList.add('active'); setTimeout(function(){ document.querySelectorAll('#b-phone input')[0].focus(); }, 50); }
    } else {
      phoneVal=val;
      if(val.length===4){ doQuery(idcVal, val); }
    }
  }

  function showMsg(t){ msg.textContent=t; msg.className='msg '+(t?'err':''); }
  function showResult(html){ result.innerHTML=html; result.style.display='block'; }

  function doQuery(v1, v2){
    fetch('/api/query?idc='+encodeURIComponent(v1)+'&phone='+encodeURIComponent(v2))
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
      .then(function(res){
        if(!res.ok){ showMsg(res.data.error||'查询失败'); return; }
        var d=res.data;
        var rows='';
        if(!d.leaves || d.leaves.length===0){ rows='<div class="empty">暂无记录</div>'; }
        else {
          d.leaves.forEach(function(l){
            rows+='<div class="row"><span>'+l.leave_date+(l.note?' · '+l.note:'')+'</span><span class="d">'+l.days+' 天</span></div>';
          });
        }
        sId.classList.remove('active'); sPhone.classList.remove('active');
        showResult(
          '<div class="greet">'+d.name+'</div>'+
          '<div class="stat">'+
            '<div class="box"><div class="num">'+d.total_days+'</div><div class="lbl">总天数</div></div>'+
            '<div class="box"><div class="num">'+d.used_days+'</div><div class="lbl">已休</div></div>'+
            '<div class="box"><div class="num">'+d.remain_days+'</div><div class="lbl">剩余</div></div>'+
          '</div>'+
          '<div class="list">'+rows+'</div>'+
          '<div class="back"><button onclick="location.reload()">返回</button></div>'
        );
      })
      .catch(function(){ showMsg('网络异常'); });
  }
})();
</script>
</body>
</html>
