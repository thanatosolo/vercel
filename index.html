<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查询</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #0a4da3 0%, #1e90ff 55%, #7cc7ff 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    padding: 40px 28px;
    box-shadow: 0 12px 40px rgba(10,77,163,0.35);
  }
  .field { display:none; }
  .field.active { display:block; }
  .field .tag {
    font-size: 15px; font-weight: 700; letter-spacing: 2px; color:#0a4da3;
    text-align:center; margin-bottom: 12px;
  }
  .field input {
    width:100%; padding: 16px 0; font-size: 30px; text-align:center; letter-spacing: 12px;
    border:none; border-bottom: 2px solid #c9dcf3; outline:none; color:#0a4da3; background:transparent;
  }
  .field input:focus { border-bottom-color:#1e90ff; }
  .result { margin-top: 26px; }
  .stat { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .stat .box {
    flex:1 1 90px; background:#f4f9ff; border-radius:12px; padding:14px 8px; text-align:center;
  }
  .stat .box .num { font-size: 24px; font-weight:700; color:#0a4da3; }
  .stat .box .lbl { font-size: 12px; color:#7a8ba6; margin-top:4px; }
  .greet { text-align:center; font-size:17px; font-weight:600; color:#2b3a55; margin-bottom:16px; }
  .list { border:1px solid #e3eefb; border-radius:10px; overflow:hidden; }
  .row {
    display:flex; justify-content:space-between; padding:11px 14px; font-size:14px; color:#3a4a66;
    border-bottom:1px solid #eef4fb;
  }
  .row:last-child { border-bottom:none; }
  .row .d { color:#0a4da3; font-weight:600; }
  .empty { text-align:center; color:#9aa7b8; font-size:14px; padding:16px; }
  .msg { text-align:center; font-size:13px; margin-top:14px; min-height:18px; }
  .msg.err { color:#e0555d; }
</style>
</head>
<body>
<div class="card">
  <div class="field active" id="f-id">
    <div class="tag">ID</div>
    <input id="idc" inputmode="numeric" maxlength="4" autocomplete="off">
  </div>
  <div class="field" id="f-phone">
    <div class="tag">MB</div>
    <input id="phone" inputmode="numeric" maxlength="4" autocomplete="off">
  </div>
  <div class="msg" id="msg"></div>
  <div class="result" id="result" style="display:none"></div>
</div>

<script>
(function(){
  var idc=document.getElementById('idc');
  var phone=document.getElementById('phone');
  var fId=document.getElementById('f-id');
  var fPhone=document.getElementById('f-phone');
  var msg=document.getElementById('msg');
  var result=document.getElementById('result');
  var idcVal='';

  function showMsg(t){ msg.textContent=t; msg.className='msg '+(t?'err':''); }
  function showResult(html){ result.innerHTML=html; result.style.display='block'; }
  function clean(){ showMsg(''); result.style.display='none'; }

  idc.addEventListener('input',function(){
    idc.value=idc.value.replace(/\D/g,'').slice(0,4);
    clean();
    if(idc.value.length===4){
      idcVal=idc.value;
      fId.classList.remove('active');
      fPhone.classList.add('active');
      phone.focus();
    }
  });

  phone.addEventListener('input',function(){
    phone.value=phone.value.replace(/\D/g,'').slice(0,4);
    clean();
    if(phone.value.length===4){ doQuery(idcVal, phone.value); }
  });

  function doQuery(v1, v2){
    fetch('/api/query?idc='+encodeURIComponent(v1)+'&phone='+encodeURIComponent(v2))
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
      .then(function(res){
        if(!res.ok){ showMsg(res.data.error||'查询失败'); return; }
        var d=res.data;
        var rows='';
        if(!d.leaves || d.leaves.length===0){ rows='<div class="empty">暂无记录</div>'; }
        else {
          d.leaves.forEach(function(l){
            rows+='<div class="row"><span>'+l.leave_date+(l.note?' · '+l.note:'')+'</span><span class="d">'+l.days+' 天</span></div>';
          });
        }
        showResult(
          '<div class="greet">'+d.name+'</div>'+
          '<div class="stat">'+
            '<div class="box"><div class="num">'+d.total_days+'</div><div class="lbl">总天数</div></div>'+
            '<div class="box"><div class="num">'+d.used_days+'</div><div class="lbl">已休</div></div>'+
            '<div class="box"><div class="num">'+d.remain_days+'</div><div class="lbl">剩余</div></div>'+
          '</div>'+
          '<div class="list">'+rows+'</div>'
        );
      })
      .catch(function(){ showMsg('网络异常'); });
  }
})();
</script>
</body>
</html>
